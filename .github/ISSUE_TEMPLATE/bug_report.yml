name: Bug report
description: Something does not work as the README or the dashboard says it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please do not report security problems here: use
        **Security → Report a vulnerability** instead.
        Remove API keys, provider tokens, cookies and passwords from everything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add provider …
        2. Create combo …
        3. Send this request …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TRouteAI version
      description: Output of `trouteai --version`, or the version in package.json for a source checkout.
      placeholder: "1.0.9"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it
      options:
        - npm package (`npm install -g trouteai`)
        - SixPanel
        - Another hosting panel
        - Source checkout
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js version and operating system
      placeholder: "Node.js 26.13, Ubuntu 26.04"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and provider
      description: The app that calls TRouteAI and the provider or combo it reaches.
      placeholder: "Claude Code 2.1.323 → combo with two Anthropic-format providers"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        The lines around the error from `logs/` in the data folder, or the terminal with
        `trouteai --verbose`. Secrets removed.
      render: text
